[functions.controlgps-invite-employee]
verify_jwt = false

[functions.controlgps-recover-account]
verify_jwt = false

[auth]
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"
site_url = "https://mindforgecpa.vercel.app"
additional_redirect_urls = ["https://mindforgecpa.vercel.app/auth/callback**", "http://localhost:5173/?welcome=1", "http://localhost:5173/?confirmed=1", "http://127.0.0.1:5173/?welcome=1", "http://127.0.0.1:5173/?confirmed=1", "https://controlgps-cyan.vercel.app/?welcome=1", "https://controlgps-cyan.vercel.app/?confirmed=1"]

[auth.email]
enable_confirmations = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false
